h1{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.55);font:700 clamp(2.1rem,8vw,3rem)/1.05 "Fredoka",sans-serif;margin:0 0 10px;letter-spacing:-.01em}
.tag{margin:0 0 34px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.links{display:grid;gap:14px}
.link{
  display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:20px;text-decoration:none;
  background:var(--card);color:var(--ink);font:600 1.15rem "Fredoka",sans-serif;
  border:2px solid transparent;box-shadow:0 6px 0 rgba(18,48,79,.18);
  transition:transform .12s ease, box-shadow .12s ease;
}
.link:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(18,48,79,.18)}
.link:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(18,48,79,.18)}
.link:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dot{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;color:#fff}
