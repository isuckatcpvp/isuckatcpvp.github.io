<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudcpvp_'s paradise</title>
    
    <!-- 1. Cloudflare Turnstile Integration Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        /* Main Site Styling */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #111111;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 800;
        }
        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .btn-launcher {
            display: inline-block;
            background-color: #0070f3;
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 1.2rem;
            margin-bottom: 40px;
            box-shadow: 0 4px 14px rgba(0, 112, 243, 0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .btn-launcher:hover {
            background-color: #0060df;
            transform: translateY(-2px);
        }
        .links-container {
            list-style: none;
            padding: 0;
            max-width: 450px;
            margin: 0 auto;
        }
        .links-container li {
            margin: 15px 0;
        }
        .links-container a {
            display: block;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 14px;
            border: 1px solid #333333;
            border-radius: 8px;
            background: #1c1c1c;
            transition: background 0.2s, border-color 0.2s;
        }
        .links-container a:hover {
            background: #252525;
            border-color: #0070f3;
        }
        footer {
            margin-top: 60px;
            font-size: 0.9rem;
            color: #555555;
        }

        /* 2. Full-Screen Gatekeeper Overlay */
        #gatekeeper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111111; /* Dark theme to match your page */
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #gatekeeper h2 {
            color: #ffffff;
            margin: 0 0 8px 0;
            font-size: 2rem;
            font-weight: 600;
        }
        #gatekeeper p {
            color: #888888;
            font-size: 1.1rem;
            margin: 0 0 30px 0;
        }
    </style>
</head>
<body>

    <!-- THE GATEKEEPER CHALLENGE -->
    <div id="gatekeeper">
        <h2>Just a moment...</h2>
        <p>Checking if your connection is secure.</p>
        <!-- Paste your Turnstile Site Key inside the quotes below -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAF1zVpA4WjqMNM7J" data-callback="onHumanVerified" data-theme="dark"></div>
    </div>

    <!-- YOUR HOME PAGE CONTENT -->
    <h1>Cloudcpvp_'s paradise</h1>
    <p>Pick a spot and come hang out.</p>

    <a href="#" class="btn-launcher">Eaglercraft launcher play now</a>

    <ul class="links-container">
        <li><a href="#">● Twitch live streams</a></li>
        <li><a href="#">Discord join the server</a></li>
        <li><a href="#">♪ TikTok clips</a></li>
        <li><a href="#">X (Twitter) updates</a></li>
        <li><a href="#">★ Instagram photos</a></li>
    </ul>

    <footer>
        © 2026 Cloudcpvp_
    </footer>

    <!-- 3. Verification Handler -->
    <script>
        function onHumanVerified(token) {
            // Instantly hide the challenge screen once Cloudflare clears the visitor
            document.getElementById('gatekeeper').style.display = 'none';
        }
    </script>

</body>
</html>
